    .type { fill: #79c0ff; font-weight: 600; }
    .field { fill: #ffa657; }
    .str { fill: #a5d6ff; }
    .punc { fill: #e6edf3; }
    .cursor { animation: cursor-blink 1s infinite steps(2); fill: #00f0ff; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; letter-spacing: 0.5px; font-weight: 500; }
  </style>

